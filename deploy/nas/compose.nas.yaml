# リポジトリ直下の compose.yaml と重ねる。手順: docs/deployment-docker-nas.md
services:
  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Monetail: Data Source=/var/lib/monetail/db/monetail.db;Mode=ReadWrite;Foreign Keys=True
      Passkeys__Origin: ${MONETAIL_ORIGIN:?Set MONETAIL_ORIGIN}
      Passkeys__RpId: ${MONETAIL_RP_ID:?Set MONETAIL_RP_ID}
      Passkeys__DataProtectionKeysPath: /var/lib/monetail/keys
      Passkeys__TrustedProxies__0: ${MONETAIL_TRUSTED_PROXY:-127.0.0.1}
      DesktopOAuth__SigningCertificatePath: /run/secrets/oauth-signing.pfx
      DesktopOAuth__EncryptionCertificatePath: /run/secrets/oauth-encryption.pfx
    volumes:
      - type: bind
        source: ${MONETAIL_DATA_DIR:?Set MONETAIL_DATA_DIR}/db
        target: /var/lib/monetail/db
        bind:
          create_host_path: false
      - type: bind
        source: ${MONETAIL_DATA_DIR:?Set MONETAIL_DATA_DIR}/keys
        target: /var/lib/monetail/keys
        bind:
          create_host_path: false
    secrets:
      - source: oauth_signing
        target: /run/secrets/oauth-signing.pfx
      - source: oauth_encryption
        target: /run/secrets/oauth-encryption.pfx
      # ASP.NET Core標準のJSON設定読込を使用する。環境変数にはパスワードを入れない。
      - source: oauth_passwords
        target: /app/appsettings.Production.json

  tailscale:
    image: ${TAILSCALE_IMAGE:?Set TAILSCALE_IMAGE to a stable version}
    network_mode: service:api
    depends_on:
      - api
    environment:
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_AUTHKEY: file:/run/secrets/tailscale-authkey
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:?Set TAILSCALE_HOSTNAME}
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - type: bind
        source: ${MONETAIL_DATA_DIR:?Set MONETAIL_DATA_DIR}/tailscale/state
        target: /var/lib/tailscale
        bind:
          create_host_path: false
      - type: bind
        source: ${MONETAIL_DATA_DIR:?Set MONETAIL_DATA_DIR}/tailscale/config
        target: /config
        read_only: true
        bind:
          create_host_path: false
    secrets:
      - tailscale_authkey
    restart: unless-stopped

secrets:
  oauth_signing:
    file: ${MONETAIL_DATA_DIR:?Set MONETAIL_DATA_DIR}/oauth/signing.pfx
  oauth_encryption:
    file: ${MONETAIL_DATA_DIR:?Set MONETAIL_DATA_DIR}/oauth/encryption.pfx
  oauth_passwords:
    file: ${MONETAIL_DATA_DIR:?Set MONETAIL_DATA_DIR}/oauth/appsettings.Production.json
  tailscale_authkey:
    file: ${MONETAIL_DATA_DIR:?Set MONETAIL_DATA_DIR}/tailscale/authkey
