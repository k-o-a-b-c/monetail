# 配布用の基底。既存compose.server.yamlと重ねる。ソース・SDK・buildは不要。
services:
  api:
    image: ${MONETAIL_IMAGE:?Set MONETAIL_IMAGE to a fixed GHCR version or digest}
    environment:
      TZ: ${TZ:-Etc/UTC}
      Registration__Mode: "InvitationOnly"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
