<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新規登録 | Monetail</title>
  <script src="/auth/enroll.js"></script>
  <script src="/auth/passkey-client.js" defer></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 3rem auto; padding: 0 1rem; max-width: 32rem; line-height: 1.7; }
    input, button { box-sizing: border-box; width: 100%; font: inherit; padding: .6rem; margin: .4rem 0 1rem; }
    #message { white-space: pre-line; }
    #name-error { color: #b42318; }
  </style>
</head>
<body data-registration="invitation">
  <main>
    <h1 id="heading">新規登録</h1>
    <form id="enrollment-form" hidden>
      <label for="display-name">表示名</label>
      <input id="display-name" type="text" required maxlength="100" autocomplete="nickname" aria-describedby="name-error">
      <p id="name-error" role="alert"></p>
      <button id="register" type="submit">登録</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
    <button id="login" type="button" hidden>ログイン</button>
    <noscript>登録にはJavaScriptが必要です。</noscript>
  </main>
</body>
</html>
