name: Tests

on:
  push:
  pull_request:

jobs:
  receipt-ui-acceptance:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/PersistenceTests/PersistenceTests.vbproj -- --check-receipt-ui "$env:RUNNER_TEMP/receipt-ui-review"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: receipt-ui-review
          path: ${{ runner.temp }}/receipt-ui-review
          if-no-files-found: error

  receipt-read-performance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/PersistenceTests/PersistenceTests.vbproj -- --measure-receipt-reads "$env:RUNNER_TEMP/receipt-read-performance.csv"
      - uses: actions/upload-artifact@v4
        with:
          name: receipt-read-performance
          path: ${{ runner.temp }}/receipt-read-performance.csv
          if-no-files-found: error

  calculations-and-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/CalculationTests/CalculationTests.vbproj
      - run: python3 -m unittest discover -s tests -p 'test_*migration.py' -v
      - run: dotnet run --project tests/DetailTaxMigrationTests/DetailTaxMigrationTests.vbproj --framework net8.0

  windows-persistence-and-ui:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/PersistenceTests/PersistenceTests.vbproj

  windows-migration-and-build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet run --project tests/DetailTaxMigrationTests/DetailTaxMigrationTests.vbproj --framework net48
      - run: dotnet build tools/DetailTaxMigration/DetailTaxMigration.vbproj
      - name: Verify migration CLI exit codes and copy safety
        run: dotnet run --project tests/DetailTaxMigrationTests/DetailTaxMigrationTests.vbproj --framework net48 -- --cli "$((Resolve-Path tools/DetailTaxMigration/bin/Debug/net48/DetailTaxMigration.exe).Path)"
      - uses: NuGet/setup-nuget@v2
        if: ${{ !cancelled() }}
      - uses: microsoft/setup-msbuild@v2
        if: ${{ !cancelled() }}
      - run: nuget restore HouseholdAccountsBeta/HouseholdAccountsBeta.sln
        if: ${{ !cancelled() }}
      - run: msbuild HouseholdAccountsBeta/HouseholdAccountsBeta.sln /p:Configuration=Debug /p:Platform="Any CPU" /verbosity:minimal
        if: ${{ !cancelled() }}
