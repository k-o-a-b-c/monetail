name: WinUI 3 foundation

# 通常検証はTestsから呼び出す。画像取得はActionsの手動実行だけで行う。
on:
  workflow_call:
    inputs:
      fingerprint:
        required: true
        type: string
      capture:
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      capture:
        description: 合成データの画面を撮影する
        default: true
        type: boolean

concurrency:
  group: winui-${{ github.event.pull_request.number || github.ref }}-${{ inputs.capture }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  winui-build-and-startup:
    runs-on: windows-latest
    env:
      WINUI_CAPTURE: ${{ inputs.capture }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: ./.github/actions/nuget-cache
        with:
          scope: winui
      - name: Get font for one-off screenshots
        if: env.WINUI_CAPTURE == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tests/Monetail.WinUI.Smoke/Assets | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf' -OutFile tests/Monetail.WinUI.Smoke/Assets/PreviewFont.otf
      - name: Build WinUI 3 application
        run: dotnet build src/Monetail.WinUI/Monetail.WinUI.csproj --configuration Release --runtime win-x64 -p:Platform=x64 --output "${{ runner.temp }}/winui-app"
      - name: Build WinUI 3 smoke test
        run: dotnet build tests/Monetail.WinUI.Smoke/Monetail.WinUI.Smoke.csproj --configuration Release --runtime win-x64 -p:Platform=x64 --output "${{ runner.temp }}/winui-smoke"
      - name: Launch product and validate the shared-window UI
        shell: pwsh
        run: |
          $capture = $env:WINUI_CAPTURE -eq 'true'
          & tests/Monetail.WinUI.Smoke/run.ps1 -AppPath "$env:RUNNER_TEMP/winui-app/Monetail.WinUI.exe" -SmokePath "$env:RUNNER_TEMP/winui-smoke/Monetail.WinUI.Smoke.exe" -OutputPath "$env:RUNNER_TEMP/winui-results" -Capture:$capture
      - name: XAML compiler failure diagnostics
        if: failure()
        shell: pwsh
        run: |
          # 生成コードと診断だけを収集し、MSBuildの環境変数/認証情報は出力しない。
          foreach ($directory in @('src/Monetail.WinUI/obj', 'tests/Monetail.WinUI.Smoke/obj')) {
            Get-ChildItem $directory -Recurse -Filter output.json -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Output $_.FullName
              Get-Content $_.FullName
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: winui-smoke-results
          path: ${{ runner.temp }}/winui-results/*
          if-no-files-found: ignore

      - uses: ./.github/actions/ci-proof
        if: inputs.fingerprint != '' && !inputs.capture
        with:
          mode: save
          check: winui
          fingerprint: ${{ inputs.fingerprint }}
